apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    project: roboshop
    environment: dev
spec:
  type: NodePort
# service use below labels to identify the pods to which it will route the traffic
  selector:
    project: roboshop
    environment: dev
    component: frontend
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
------
apiVersion: v1
kind: Pod
metadata: 
  name: nginx
  labels:
    project: roboshop
    environment: dev
    component: frontend
    tier: frontend
spec:
  containers:
    - name: nginx   # container name
      image: nginx
